<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Violence Detection Dashboard - Police Alert System</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            font-size: 28px;
            color: #ff4444;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            font-weight: bold;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.safe {
            background: #44ff44;
            box-shadow: 0 0 10px #44ff44;
        }

        .status-dot.danger {
            background: #ff4444;
            box-shadow: 0 0 15px #ff4444;
            animation: pulse-danger 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes pulse-danger {
            0%, 100% { opacity: 1; box-shadow: 0 0 15px #ff4444; }
            50% { opacity: 0.3; box-shadow: 0 0 25px #ff4444; }
        }

        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .video-panel {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 2px solid #444;
        }

        .video-title {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 2px solid #ff4444;
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            background: #000;
        }

        .video-feed {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            pointer-events: none;
        }

        .confidence-display {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            width: 100%;
            text-align: center;
        }

        .confidence-bar {
            width: 100%;
            height: 30px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            overflow: hidden;
            margin: 10px 0;
            border: 2px solid #444;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #44ff44, #ffff44, #ff4444);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
            font-size: 12px;
        }

        .controls-panel {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 2px solid #444;
        }

        .control-section {
            margin-bottom: 20px;
        }

        .control-section h3 {
            font-size: 14px;
            color: #ffaa00;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .threshold-control {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="range"] {
            flex: 1;
            height: 8px;
            border-radius: 5px;
            background: #444;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ff4444;
            cursor: pointer;
            box-shadow: 0 0 10px #ff4444;
        }

        .threshold-value {
            min-width: 45px;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 3px;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-box {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            border-radius: 5px;
            padding: 10px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #ff4444;
        }

        .alerts-section {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 2px solid #444;
        }

        .alerts-title {
            font-size: 18px;
            color: #ff4444;
            margin-bottom: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-icon {
            font-size: 24px;
            animation: bounce 0.6s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .alerts-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .alert-item {
            background: rgba(255, 68, 68, 0.1);
            border-left: 4px solid #ff4444;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alert-item.acknowledged {
            background: rgba(68, 255, 68, 0.1);
            border-left-color: #44ff44;
            opacity: 0.7;
        }

        .alert-details {
            flex: 1;
        }

        .alert-time {
            font-size: 12px;
            color: #aaa;
        }

        .alert-confidence {
            font-size: 14px;
            color: #ffaa00;
            font-weight: bold;
            margin-top: 5px;
        }

        .alert-status {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 3px;
            background: #ff4444;
            color: white;
            font-weight: bold;
        }

        .alert-status.acknowledged {
            background: #44ff44;
            color: #000;
        }

        .ack-btn {
            background: #ffaa00;
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            margin-left: 10px;
            transition: all 0.2s;
        }

        .ack-btn:hover {
            background: #ffbb11;
            transform: scale(1.05);
        }

        .ack-btn:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .connection-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 5px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .connection-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #44ff44;
        }

        .connection-dot.disconnected {
            background: #ff4444;
            animation: pulse 1s infinite;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar-thumb {
            background: #ff4444;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🚨 VIOLENCE DETECTION DASHBOARD</h1>
                <p style="font-size: 12px; color: #aaa; margin-top: 5px;">Police Alert System</p>
            </div>
            <div class="status-indicator">
                <span id="status-text">Monitoring...</span>
                <div class="status-dot safe" id="status-dot"></div>
            </div>
        </header>

        <div class="main-content">
            <div class="video-panel">
                <div class="video-title">📹 Live Camera Feed</div>
                <div class="video-container">
                    <img class="video-feed" id="video-stream" src="/video_feed" alt="Video Stream">
                    <div class="video-overlay">
                        <div class="confidence-display">
                            <div style="font-size: 14px; color: #aaa;">Violence Confidence Level</div>
                            <div class="confidence-bar">
                                <div class="confidence-fill" id="confidence-fill" style="width: 0%">0%</div>
                            </div>
                            <div id="confidence-text" style="font-size: 16px; font-weight: bold;">0.00%</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="controls-panel">
                <div class="control-section">
                    <h3>⚙️ SETTINGS</h3>
                    <div class="threshold-control">
                        <span style="font-size: 12px; min-width: 40px;">Low</span>
                        <input type="range" id="threshold-slider" min="0" max="100" value="60">
                        <span style="font-size: 12px; min-width: 40px;">High</span>
                    </div>
                    <div class="threshold-value" id="threshold-display">60%</div>
                </div>

                <div class="control-section">
                    <h3>📊 STATISTICS</h3>
                    <div class="stats">
                        <div class="stat-box">
                            <div class="stat-label">Frames Processed</div>
                            <div class="stat-value" id="frame-count">0</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Total Alerts</div>
                            <div class="stat-value" id="alert-count">0</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="alerts-section">
            <div class="alerts-title">
                <span class="alert-icon">🚨</span>
                RECENT ALERTS (Police Dispatch)
            </div>
            <div class="alerts-list" id="alerts-list">
                <div style="text-align: center; color: #aaa; padding: 20px;">
                    No alerts yet. System is monitoring...
                </div>
            </div>
        </div>
    </div>

    <div class="connection-status">
        <div class="connection-dot" id="connection-dot"></div>
        <span id="connection-text">Connected</span>
    </div>

    <script>
        const socket = io();
        let currentData = {};
        let allAlerts = [];

        // WebSocket Connection
        socket.on('connect', () => {
            console.log('Connected to server');
            updateConnectionStatus(true);
        });

        socket.on('disconnect', () => {
            console.log('Disconnected from server');
            updateConnectionStatus(false);
        });

        socket.on('detection_update', (data) => {
            currentData = data;
            updateUI(data);
        });

        function updateConnectionStatus(connected) {
            const dot = document.getElementById('connection-dot');
            const text = document.getElementById('connection-text');
            if (connected) {
                dot.classList.remove('disconnected');
                text.textContent = 'Connected';
            } else {
                dot.classList.add('disconnected');
                text.textContent = 'Disconnected';
            }
        }

        function updateUI(data) {
            // Update confidence
            const confidence = data.confidence * 100;
            document.getElementById('confidence-text').textContent = confidence.toFixed(2) + '%';
            document.getElementById('confidence-fill').style.width = confidence + '%';

            // Update status indicator
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            if (data.is_violence_detected) {
                statusDot.classList.remove('safe');
                statusDot.classList.add('danger');
                statusText.textContent = '⚠️ VIOLENCE DETECTED!';
            } else {
                statusDot.classList.remove('danger');
                statusDot.classList.add('safe');
                statusText.textContent = '✓ Safe';
            }

            // Update stats
            document.getElementById('frame-count').textContent = data.frame_count;
            document.getElementById('alert-count').textContent = data.alerts_count;
        }

        // Threshold slider
        document.getElementById('threshold-slider').addEventListener('input', (e) => {
            const value = e.target.value;
            const percent = value / 100;
            document.getElementById('threshold-display').textContent = value + '%';

            fetch('/api/threshold', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({threshold: percent})
            });
        });

        // Fetch alerts periodically
        async function fetchAlerts() {
            try {
                const response = await fetch('/api/alerts?limit=10');
                const data = await response.json();
                updateAlertsList(data.alerts);
            } catch (error) {
                console.error('Error fetching alerts:', error);
            }
        }

        function updateAlertsList(alerts) {
            const list = document.getElementById('alerts-list');

            if (alerts.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: #aaa; padding: 20px;">No alerts yet. System is monitoring...</div>';
                return;
            }

            list.innerHTML = alerts.map((alert, idx) => {
                const date = new Date(alert.timestamp * 1000);
                const time = date.toLocaleTimeString();
                const isAcknowledged = alert.status === 'ACKNOWLEDGED';

                return `
                    <div class="alert-item ${isAcknowledged ? 'acknowledged' : ''}">
                        <div class="alert-details">
                            <div class="alert-time">${time}</div>
                            <div class="alert-confidence">Confidence: ${(alert.confidence * 100).toFixed(1)}%</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <div class="alert-status ${isAcknowledged ? 'acknowledged' : ''}">${alert.status}</div>
                            ${!isAcknowledged ? `<button class="ack-btn" onclick="acknowledgeAlert(${alert.id})">ACKNOWLEDGE</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function acknowledgeAlert(alertId) {
            fetch(`/api/alerts/${alertId}/acknowledge`, {
                method: 'POST'
            }).then(() => {
                fetchAlerts();
            });
        }

        // Update alerts every 2 seconds
        setInterval(fetchAlerts, 2000);

        // Initial data fetch
        fetchAlerts();
    </script>
</body>
</html>
